name: Build Xcortex NFC App

on:
  push:
    branches: [ main ]
  workflow_dispatch: # Позволяет запустить вручную кнопкой

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Capacitor & Dependencies
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          
      - name: Initialize Project Structure
        run: |
          mkdir -p www
          cp index.html www/index.html
          npx cap init "Xcortex Writer" "io.xcortex.writer" --web-dir=www
          npx cap add android
          npx cap sync

      - name: Add NFC Permissions
        run: |
          sed -i '/<manifest/a \    <uses-permission android:name="android.permission.NFC" />\n    <uses-feature android:name="android.hardware.nfc" android:required="true" />' android/app/src/main/AndroidManifest.xml

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: xcortex-nfc-writer
          path: android/app/build/outputs/apk/debug/app-debug.apk
