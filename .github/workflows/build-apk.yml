name: Build Xcortex NFC App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 1. Создаем структуру папок ДО установки зависимостей
      - name: Prepare Web Directory
        run: |
          mkdir -p www
          cp index.html www/index.html

      # 2. Инициализируем проект
      - name: Initialize Capacitor Project
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Xcortex Writer" "io.xcortex.writer" --web-dir=www
          npx cap add android
          npx cap sync

      # 3. Добавляем права NFC через sed (более надежный способ для CI)
      - name: Add NFC Permissions to Manifest
        run: |
          MANIFEST_PATH="android/app/src/main/AndroidManifest.xml"
          if grep -q "android.permission.NFC" "$MANIFEST_PATH"; then
            echo "NFC permission already exists."
          else
            sed -i '/<manifest/a \    <uses-permission android:name="android.permission.NFC" />\n    <uses-feature android:name="android.hardware.nfc" android:required="true" />' "$MANIFEST_PATH"
            echo "Added NFC permissions."
          fi

      # 4. Настройка Java
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 5. КРИТИЧЕСКИЙ ШАГ: Даем права на исполнение gradlew
      - name: Grant Execute Permission for Gradle Wrapper
        run: chmod +x android/gradlew

      # 6. Сборка APK
      - name: Build Debug APK
        working-directory: ./android
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace

      # 7. Загрузка артефакта
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: xcortex-nfc-writer
          path: android/app/build/outputs/apk/debug/app-debug.apk
